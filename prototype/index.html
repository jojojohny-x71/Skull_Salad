<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skull Salad</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Kalam:wght@400;700&family=Permanent+Marker&family=Reenie+Beanie&family=Shadows+Into+Light&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>
<div id="layer"><div class="toasts" aria-live="polite"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/canvas.js"></script>
<script src="js/home.js"></script>
<script src="js/library.js"></script>
<script src="js/capture.js"></script>
<script src="js/sims.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
